name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,server,telegram]"

      - name: Run tests
        run: pytest --tb=short -q
        env:
          ANTCREW_SANDBOX: none   # tests use real subprocess; Docker path mismatch on CI

  pypi-compat:
    name: PyPI compat (published wheel)
    runs-on: ubuntu-latest
    # Only run on main push — verifies the published release works, not pre-release commits.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install published antcrew from PyPI (not editable)
        # Installs the wheel that users actually get with pip install antcrew.
        # If this fails with ImportError or version mismatches, a release has a
        # defect that the editable install job above would not catch.
        run: |
          pip install "antcrew[dev]"
          pip install hypothesis  # test dep added in 0.33.21; older published wheels omit it

      - name: Run tests against installed wheel
        # --override-ini suppresses the addopts coverage flags: the published
        # wheel may predate pytest-cov being added to dev extras.
        run: pytest --tb=short -q --override-ini="addopts="
        env:
          ANTCREW_SANDBOX: none

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting and style
        run: ruff check antcrew/

  security:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and security tools
        run: pip install -e ".[dev,server,telegram]" "bandit[toml]" pip-audit

      - name: bandit — static security analysis (MEDIUM+)
        # -ll  skip LOW severity   -ii  skip LOW confidence
        # -c pyproject.toml reads [tool.bandit] (B608 skip for parameterized WHERE clauses)
        run: bandit -r antcrew/ -ll -ii -c pyproject.toml

      - name: pip-audit — dependency CVE scan
        run: pip-audit

      - name: semgrep — SAST (application logic)
        run: |
          pip install semgrep
          semgrep --config p/python --config p/owasp-top-ten antcrew/ --error --quiet

  changelog:
    name: CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check CHANGELOG entry for current version
        run: |
          python3 - << 'PYEOF'
          import tomllib, sys
          with open("pyproject.toml", "rb") as f:
              v = tomllib.load(f)["project"]["version"]
          with open("CHANGELOG.md") as f:
              content = f.read()
          if f"[{v}]" not in content:
              print(f"::error::CHANGELOG.md is missing an entry for version {v}")
              sys.exit(1)
          print(f"OK: CHANGELOG.md has entry for [{v}]")
          PYEOF
