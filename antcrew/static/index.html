<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AntCrew Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #94a3b8;
           display: flex; align-items: center; justify-content: center; min-height: 100vh;
           margin: 0; }
    .box { text-align: center; max-width: 500px; padding: 2rem; }
    h1 { color: #f1f5f9; margin-bottom: 1rem; }
    code { background: #1e293b; padding: 0.5rem 1rem; border-radius: 4px;
           display: block; margin: 1rem 0; font-family: monospace; color: #818cf8; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🐜 AntCrew Dashboard</h1>
    <p>The dashboard has not been built yet. To build it, run:</p>
    <code>cd dashboard &amp;&amp; npm install &amp;&amp; npm run build</code>
    <p>Then restart <code>antcrew serve</code>.</p>
    <p style="margin-top:1rem">The REST API is available at
      <a href="/docs" style="color:#818cf8">/docs</a>.
    </p>
  </div>
</body>
</html>
