# Example antcrew documentation schema for a COBOL legacy workspace.
#
# Place this file at the root of your workspace docs directory and pass it
# via --schema (CLI) or schema_path= (Python API).
#
# Document types defined here are used by COBOLAnalyzerExecutor,
# RequirementsElicitationExecutor, and the other COBOL capabilities to
# discover and route source files automatically.

documentation_schema:
  org_name: Acme Corp
  org_type: legacy            # enables COBOL-aware routing in the engine

  if_legacy:
    cobol_support:
      enabled: true
      as400_connection: false   # set true if you use AS400Connector
      copybook_parsing: true    # parse .cpy / .copy files
      batch_job_docs: true      # treat COBOL programs as batch-job docs

  document_types:

    - id: cobol_source
      name: COBOL Source Program
      category: technical
      purpose: COBOL batch programs (.cbl, .cob) that make up the legacy system
      parser: cobol
      related_to: [copybook, jcl, data_dictionary]

    - id: copybook
      name: COBOL Copybook
      category: technical
      purpose: Shared data structures included by COPY statements
      parser: cobol
      related_to: [cobol_source]

    - id: functional_spec
      name: Functional Specification
      category: functional
      purpose: Business requirements and functional rules for each program
      parser: markdown
      related_to: [cobol_source, data_dictionary]

    - id: data_dictionary
      name: Data Dictionary
      category: technical
      purpose: Field definitions, PIC clauses, valid values, and business meaning
      parser: markdown
      related_to: [cobol_source, copybook]

    - id: jcl
      name: JCL Procedure
      category: operational
      purpose: Job Control Language for batch scheduling and execution
      parser: text
      related_to: [cobol_source]

  path_rules:
    # Map storage prefixes to document types — used by index_from_storage()
    # when files have no antcrew metadata sidecar.
    - prefix: "cobol/"
      doc_type: cobol_source

    - prefix: "copybooks/"
      doc_type: copybook

    - prefix: "specs/"
      doc_type: functional_spec

    - prefix: "data-dictionary/"
      doc_type: data_dictionary

    - prefix: "jcl/"
      doc_type: jcl

  query_hints:
    # Route search queries to the right types based on intent keywords.
    - pattern: "batch|job|JCL|procedure step"
      doc_types: [jcl, cobol_source]

    - pattern: "copybook|copy member|field layout|data item|PIC clause"
      doc_types: [copybook, data_dictionary]

    - pattern: "spec|requirement|business rule|functional|SRS"
      doc_types: [functional_spec]

    - pattern: "program|PROGRAM-ID|paragraph|PERFORM|CALL|WORKING-STORAGE"
      doc_types: [cobol_source]

    - pattern: "data dictionary|field|column|table|DB2"
      doc_types: [data_dictionary]

  agent_hints:
    # Tell the COBOL capabilities which doc types to prioritise.
    # Class names are matched as substrings against the executor class name.
    RequirementsElicitation:
      - "For business rules: search Functional Specification (functional_spec)"
      - "For data definitions: search Data Dictionary (data_dictionary)"
    COBOLAnalyzer:
      - "For source programs: search COBOL Source Program (cobol_source)"
      - "For shared structures: search COBOL Copybook (copybook)"
    COBOLGenerator:
      - "For requirements: search Functional Specification (functional_spec)"
      - "For data definitions: search Data Dictionary (data_dictionary)"
      - "For existing programs to use as reference: search COBOL Source Program (cobol_source)"
    COBOLRefactorer:
      - "For naming conventions: search COBOL Source Program (cobol_source)"
      - "For copybook dependencies: search COBOL Copybook (copybook)"
    COBOLTestGenerator:
      - "For expected behaviour: search Functional Specification (functional_spec)"
      - "For input/output fields: search Data Dictionary (data_dictionary)"
      - "For job structure: search JCL Procedure (jcl)"
