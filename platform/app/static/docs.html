<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>antcrew · Docs</title>
<link rel="stylesheet" href="/static/tailwind.css">
<link rel="stylesheet" href="/static/design.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
<style>
body { font-family: 'Inter', system-ui, sans-serif; }
pre, code, .mono { font-family: 'JetBrains Mono', monospace; }

/* Sidebar */
.nav-section { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #475569; padding: 0.75rem 0.75rem 0.25rem; }
.nav-item { display: block; width: 100%; text-align: left; padding: 0.3rem 0.75rem; font-size: 0.8rem; color: #64748b; border-radius: 6px; cursor: pointer; transition: color 0.1s, background 0.1s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item:hover { color: #e2e8f0; background: #1e293b; }
.nav-item.active { color: #818cf8; background: rgba(99,102,241,0.1); font-weight: 500; }

/* Prose */
.prose { max-width: 720px; color: #cbd5e1; line-height: 1.75; }
.prose h1 { font-size: 1.6rem; font-weight: 700; color: #f1f5f9; margin: 0 0 1.25rem; }
.prose h2 { font-size: 1.15rem; font-weight: 600; color: #e2e8f0; margin: 2.25rem 0 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid #1e293b; }
.prose h3 { font-size: 1rem; font-weight: 600; color: #cbd5e1; margin: 1.75rem 0 0.5rem; }
.prose h4 { font-size: 0.9rem; font-weight: 600; color: #94a3b8; margin: 1.5rem 0 0.4rem; }
.prose p { margin-bottom: 0.9rem; font-size: 0.9rem; }
.prose ul, .prose ol { padding-left: 1.5rem; margin-bottom: 0.9rem; }
.prose li { font-size: 0.9rem; margin-bottom: 0.2rem; }
.prose a { color: #818cf8; text-decoration: underline; text-underline-offset: 2px; }
.prose a:hover { color: #a5b4fc; }
.prose code { background: #0f172a; border: 1px solid #1e293b; border-radius: 4px; padding: 1px 5px; font-size: 0.8rem; color: #a5b4fc; }
.prose pre { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 1.1rem 1.25rem; overflow-x: auto; margin: 1rem 0; }
.prose pre code { background: none; border: none; padding: 0; color: #93c5fd; font-size: 0.82rem; }
.prose table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.85rem; }
.prose th { text-align: left; padding: 8px 12px; font-weight: 600; color: #94a3b8; border-bottom: 1px solid #1e293b; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; }
.prose td { padding: 8px 12px; border-bottom: 1px solid #0f172a; color: #94a3b8; }
.prose blockquote { border-left: 3px solid #334155; padding: 0.5rem 1rem; margin: 1rem 0; color: #64748b; font-style: italic; }
.prose hr { border: none; border-top: 1px solid #1e293b; margin: 2rem 0; }
.prose strong { color: #e2e8f0; font-weight: 600; }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen" x-data="docsApp()" x-init="init()">

<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside class="hidden md:flex flex-col w-56 shrink-0 border-r border-gray-800/60 overflow-y-auto" style="max-height:100vh; position:sticky; top:0">
    <div class="px-3 py-4">
      <a href="/runs" class="flex items-center gap-2 mb-4 text-gray-500 hover:text-gray-300 text-xs transition">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Back to app
      </a>

      <!-- Search -->
      <div class="relative mb-3">
        <input x-model="search" type="text" placeholder="Search docs…"
          class="w-full bg-gray-900 border border-gray-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-indigo-500 placeholder-gray-600 pr-7">
        <svg class="absolute right-2 top-1.5 text-gray-600" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </div>

      <template x-for="section in filteredNav" :key="section.title">
        <div class="mb-1">
          <div class="nav-section" x-text="section.title"></div>
          <template x-for="item in section.items" :key="item.path">
            <button class="nav-item" :class="{active: currentPath === item.path}"
              @click="load(item.path)" x-text="item.label"></button>
          </template>
        </div>
      </template>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 px-8 py-8 overflow-auto">
    <!-- Mobile: section selector -->
    <div class="md:hidden mb-4">
      <select @change="load($event.target.value)"
        class="bg-gray-900 border border-gray-800 rounded-lg px-3 py-2 text-sm w-full">
        <template x-for="section in nav" :key="section.title">
          <optgroup :label="section.title">
            <template x-for="item in section.items" :key="item.path">
              <option :value="item.path" :selected="currentPath === item.path" x-text="item.label"></option>
            </template>
          </optgroup>
        </template>
      </select>
    </div>

    <!-- Loading spinner -->
    <div x-show="loading" class="flex items-center gap-3 text-gray-500 py-12">
      <svg class="animate-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      <span class="text-sm">Loading…</span>
    </div>

    <!-- Error -->
    <div x-show="error && !loading" class="py-12 text-center text-gray-600 text-sm" x-text="error"></div>

    <!-- Content -->
    <div x-show="!loading && !error" class="prose" x-html="html"></div>

    <!-- Prev / Next navigation -->
    <div x-show="!loading && !error" class="mt-12 pt-6 border-t border-gray-800/60 flex justify-between">
      <template x-if="prevItem">
        <button @click="load(prevItem.path)"
          class="flex items-center gap-2 text-sm text-gray-500 hover:text-indigo-400 transition">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          <span x-text="prevItem.label"></span>
        </button>
      </template>
      <div x-show="!prevItem"></div>
      <template x-if="nextItem">
        <button @click="load(nextItem.path)"
          class="flex items-center gap-2 text-sm text-gray-500 hover:text-indigo-400 transition">
          <span x-text="nextItem.label"></span>
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </template>
    </div>
  </main>
</div>

<script>
function docsApp() {
  const NAV = [
    { title: 'Get Started', items: [
      { label: 'Home', path: 'index.md' },
      { label: '5-minute quick start', path: 'guides/quickstart.md' },
      { label: 'A full team in action', path: 'guides/fullstack-team.md' },
      { label: 'Change-management pipeline', path: 'guides/change-management.md' },
    ]},
    { title: 'SDK Reference', items: [
      { label: 'Overview', path: 'engine/index.md' },
      { label: 'Quick agents', path: 'engine/quick-agent.md' },
      { label: 'Typed artifacts', path: 'engine/contracts.md' },
      { label: 'LLM providers', path: 'engine/providers.md' },
      { label: 'ComparisonLLM', path: 'engine/comparison.md' },
      { label: 'LiteLLM (100+ providers)', path: 'engine/litellm.md' },
      { label: 'MCP tools', path: 'engine/mcp-tools.md' },
      { label: 'EvalSuite — regression', path: 'engine/eval-suite.md' },
      { label: 'Governance & provenance', path: 'engine/governance.md' },
      { label: 'TraceLog & Replay', path: 'engine/tracelog.md' },
      { label: 'Event payload schema', path: 'engine/event-schema.md' },
      { label: 'Custom capabilities', path: 'engine/custom-agents.md' },
    ]},
    { title: 'Platform', items: [
      { label: 'Overview', path: 'platform/index.md' },
      { label: 'Quick start', path: 'platform/getting-started.md' },
      { label: 'Workspaces & API keys', path: 'platform/workspaces.md' },
      { label: 'CLI & API integration', path: 'platform/cli-integration.md' },
      { label: 'Runs & tickets', path: 'platform/runs.md' },
      { label: 'Model configuration', path: 'platform/model-config.md' },
      { label: 'HITL reviews', path: 'platform/hitl.md' },
      { label: 'GitHub App', path: 'platform/github-app.md' },
      { label: 'Webhooks', path: 'platform/webhooks.md' },
      { label: 'Evals', path: 'platform/evals.md' },
      { label: 'Eval health & trends', path: 'platform/eval-health.md' },
      { label: 'Client portal', path: 'platform/client-portal.md' },
      { label: 'Run attestation', path: 'platform/attestation.md' },
      { label: 'Compliance Pack', path: 'platform/compliance-pack.md' },
      { label: 'PM integrations', path: 'platform/pm-integrations.md' },
      { label: 'Team history & regression', path: 'platform/team-history.md' },
      { label: 'Cost estimation', path: 'platform/cost-estimation.md' },
      { label: 'Field encryption', path: 'platform/encryption.md' },
      { label: 'Agent memory', path: 'platform/run-memory.md' },
      { label: 'A2A Protocol', path: 'platform/a2a.md' },
      { label: 'Data retention', path: 'platform/data-retention.md' },
      { label: 'Self-hosted deploy', path: 'platform/self-hosted.md' },
    ]},
    { title: 'Proxy', items: [
      { label: 'Overview', path: 'proxy/index.md' },
      { label: 'Configuration', path: 'proxy/configuration.md' },
      { label: 'Provider routing', path: 'proxy/routing.md' },
    ]},
    { title: 'Architecture', items: [
      { label: 'Components & architecture', path: 'architecture/overview.md' },
      { label: 'Architecture decisions', path: 'architecture/decisions.md' },
      { label: 'Run lifecycle & events', path: 'architecture/data-flow.md' },
      { label: 'Security', path: 'architecture/security.md' },
    ]},
    { title: 'Releases', items: [
      { label: 'Week of 6 Oct 2026', path: 'releases/2026-w41.md' },
      { label: 'Week of 29 Sep 2026', path: 'releases/2026-w40.md' },
      { label: 'Week of 15 Sep 2026', path: 'releases/2026-w38.md' },
      { label: 'Week of 25 Aug 2026', path: 'releases/2026-w35.md' },
      { label: 'Week of 18 Aug 2026', path: 'releases/2026-w34.md' },
      { label: 'Week of 11 Aug 2026', path: 'releases/2026-w33.md' },
      { label: 'Week of 4 Aug 2026', path: 'releases/2026-w32.md' },
    ]},
  ];

  // Flat list for prev/next navigation
  const ALL = NAV.flatMap(s => s.items);

  return {
    nav: NAV,
    search: '',
    currentPath: '',
    loading: false,
    error: '',
    html: '',

    get filteredNav() {
      const q = this.search.trim().toLowerCase();
      if (!q) return this.nav;
      return this.nav.map(s => ({
        ...s,
        items: s.items.filter(i => i.label.toLowerCase().includes(q)),
      })).filter(s => s.items.length > 0);
    },

    get prevItem() {
      const idx = ALL.findIndex(i => i.path === this.currentPath);
      return idx > 0 ? ALL[idx - 1] : null;
    },

    get nextItem() {
      const idx = ALL.findIndex(i => i.path === this.currentPath);
      return idx >= 0 && idx < ALL.length - 1 ? ALL[idx + 1] : null;
    },

    async load(path) {
      this.currentPath = path;
      this.loading = true;
      this.error = '';
      this.html = '';
      history.replaceState({}, '', `/docs#${path}`);

      try {
        const r = await fetch(`/docs/content/${path}`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const md = await r.text();
        // Convert relative .md links to hash-based navigation
        const resolved = md.replace(/\[([^\]]+)\]\(([^)]+\.md[^)]*)\)/g, (_, label, href) => {
          // Resolve relative to current path's directory
          const base = path.includes('/') ? path.substring(0, path.lastIndexOf('/') + 1) : '';
          const abs = href.startsWith('/') ? href.slice(1) : base + href;
          return `[${label}](#nav:${abs})`;
        });
        this.html = marked.parse(resolved);
        // Handle nav: links
        this.$nextTick(() => {
          document.querySelectorAll('a[href^="#nav:"]').forEach(a => {
            a.addEventListener('click', e => {
              e.preventDefault();
              const p = a.getAttribute('href').replace('#nav:', '');
              this.load(p);
            });
          });
          // Scroll to top
          document.querySelector('main').scrollTo(0, 0);
        });
      } catch(e) {
        this.error = `Could not load "${path}": ${e.message}`;
      } finally {
        this.loading = false;
      }
    },

    init() {
      const hash = location.hash.replace('#', '');
      const start = hash && ALL.find(i => i.path === hash) ? hash : 'index.md';
      this.load(start);
    },
  };
}
</script>
</body>
</html>
