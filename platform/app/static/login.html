<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1E4D6B">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — antcrew</title>
<link rel="stylesheet" href="/static/tailwind.css">
<link rel="stylesheet" href="/static/design.css">
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<style>[x-cloak]{display:none!important}</style>
    <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js')}</script>
  </head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center p-6"
  x-data="loginApp()" x-init="init()">

<div class="w-full max-w-md">

  <!-- Logo -->
  <div class="text-center mb-8">
    <span class="font-mono font-bold text-2xl text-indigo-400">antcrew</span>
    <p class="text-gray-500 text-sm mt-1">AI pipeline platform</p>
  </div>

  <!-- ── STATE: login ─────────────────────────────────────────────────── -->
  <div x-show="state === 'login'" x-cloak>
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8">
      <h2 class="text-lg font-semibold mb-6">Inicia sesión</h2>

      <div class="space-y-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1.5">Email</label>
          <input x-model="email" type="email" placeholder="tu@empresa.com"
            @keydown.enter="doLogin()"
            class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 placeholder-gray-600">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1.5">Contraseña</label>
          <input x-model="password" type="password" placeholder="••••••••"
            @keydown.enter="doLogin()"
            class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 placeholder-gray-600">
        </div>
      </div>

      <p x-show="loginError" x-cloak class="text-red-400 text-xs mt-3" x-text="loginError"></p>

      <button @click="doLogin()"
        :disabled="loginLoading || !email.trim() || !password"
        class="mt-6 w-full py-2.5 rounded-lg font-medium text-sm transition
          bg-indigo-600 hover:bg-indigo-500 text-white disabled:opacity-50 disabled:cursor-not-allowed">
        <span x-show="!loginLoading">Iniciar sesión →</span>
        <span x-show="loginLoading" style="display:none">Entrando…</span>
      </button>

      <!-- SSO divider (shown only when ssoEnabled) -->
      <template x-if="ssoEnabled">
        <div>
          <div class="flex items-center gap-3 mt-5">
            <div class="flex-1 h-px bg-gray-800"></div>
            <span class="text-xs text-gray-600">o continúa con</span>
            <div class="flex-1 h-px bg-gray-800"></div>
          </div>
          <a href="/auth/sso/github"
            class="mt-3 flex items-center justify-center gap-2 w-full py-2.5 rounded-lg text-sm font-medium
              bg-gray-900 hover:bg-gray-800 border border-gray-700 hover:border-gray-600 text-gray-200 transition">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.38.6.1.82-.26.82-.58v-2.03c-3.34.72-4.04-1.61-4.04-1.61-.54-1.38-1.33-1.74-1.33-1.74-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.23 1.84 1.23 1.07 1.84 2.8 1.3 3.49.99.1-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57C20.57 21.8 24 17.3 24 12 24 5.37 18.63 0 12 0z"/>
            </svg>
            Continuar con GitHub
          </a>
        </div>
      </template>
    </div>

    <p class="text-center text-xs text-gray-600 mt-5">
      ¿No tienes cuenta?
      <a href="/onboard" class="text-indigo-400 hover:text-indigo-300 transition">Crear cuenta</a>
    </p>
  </div>

  <!-- ── STATE: mfa ─────────────────────────────────────────────────── -->
  <div x-show="state === 'mfa'" x-cloak style="display:none">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8">
      <h2 class="text-lg font-semibold mb-1">Autenticación de dos factores</h2>
      <p class="text-gray-400 text-sm mb-6">
        Introduce el código de 6 dígitos de tu app de autenticación.
      </p>

      <div class="mb-4">
        <label class="block text-xs text-gray-400 mb-1.5">Código TOTP</label>
        <input x-model="mfaCode" type="text" inputmode="numeric" maxlength="6"
          placeholder="000000"
          @keydown.enter="doMfaChallenge()"
          class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-3 text-2xl text-center font-mono tracking-[0.5em] focus:outline-none focus:border-indigo-500 placeholder-gray-700">
      </div>

      <p x-show="mfaError" x-cloak class="text-red-400 text-xs mb-3" x-text="mfaError"></p>

      <button @click="doMfaChallenge()"
        :disabled="mfaLoading || mfaCode.length !== 6"
        class="w-full py-2.5 rounded-lg font-medium text-sm transition
          bg-indigo-600 hover:bg-indigo-500 text-white disabled:opacity-50 disabled:cursor-not-allowed">
        <span x-show="!mfaLoading">Verificar →</span>
        <span x-show="mfaLoading" style="display:none">Verificando…</span>
      </button>
    </div>

    <p class="text-center text-xs text-gray-600 mt-5">
      <button @click="state = 'login'; mfaCode = ''; mfaError = ''; password = ''"
        class="text-gray-500 hover:text-indigo-400 transition">
        ← Volver al login
      </button>
    </p>
  </div>

</div>

<script>
function loginApp() {
  return {
    state: 'login',
    ssoEnabled: false,

    email: '',
    password: '',
    loginLoading: false,
    loginError: '',

    verifyCode: '',
    verifyLoading: false,
    verifyError: '',
    resendCooldown: 0,

    mfaToken: '',
    mfaCode: '',
    mfaLoading: false,
    mfaError: '',

    async init() {
      // Show SSO error messages from OAuth callback redirects
      const params = new URLSearchParams(location.search);
      const err = params.get('error');
      if (err) {
        const msgs = {
          github_denied: 'Acceso denegado en GitHub.',
          github_missing_params: 'Parámetros de OAuth incompletos.',
          github_state_mismatch: 'Error de seguridad en el flujo OAuth. Inténtalo de nuevo.',
          github_token_exchange: 'Error al obtener el token de GitHub.',
          github_user_fetch: 'No se pudo obtener tu perfil de GitHub.',
          github_no_email: 'Tu cuenta de GitHub no tiene email público. Actívalo en github.com/settings/emails.',
          github_no_api_key: 'Error de configuración interna. Contacta soporte.',
        };
        this.loginError = msgs[err] || `Error de SSO: ${err}`;
      }
      // Check if GitHub SSO is available on this instance
      try {
        const r = await fetch('/auth/sso/github', { method: 'HEAD', redirect: 'manual' });
        // 302 (redirect to GitHub) or 503 (not configured) — only show button if not 402/503
        this.ssoEnabled = r.status !== 402 && r.status !== 503;
      } catch { this.ssoEnabled = false; }
    },

    async doLogin() {
      this.loginError = '';
      this.loginLoading = true;
      try {
        const r = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: this.email.trim().toLowerCase(), password: this.password }),
          credentials: 'same-origin',
        });
        if (!r.ok) {
          const d = await r.json().catch(() => ({}));
          this.loginError = d.detail || `Error ${r.status}`;
          return;
        }
        const data = await r.json();
        if (data.mfa_required) {
          this.mfaToken = data.mfa_token;
          this.mfaCode = '';
          this.mfaError = '';
          this.state = 'mfa';
          return;
        }
        if (data.email_verified === false) {
          // Account exists but email not verified — let the onboard wizard handle verification
          // (it shows step 2 with the progress bar and resends the code automatically).
          window.location.href = '/onboard';
          return;
        }
        window.location.href = '/dashboard';
      } catch (e) {
        this.loginError = 'Error de red — inténtalo de nuevo';
      } finally {
        this.loginLoading = false;
      }
    },

    async doVerify() {
      this.verifyError = '';
      this.verifyLoading = true;
      try {
        const r = await fetch('/auth/verify-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: this.verifyCode.trim() }),
          credentials: 'same-origin',
        });
        if (!r.ok) {
          const d = await r.json().catch(() => ({}));
          this.verifyError = d.detail || `Error ${r.status}`;
          return;
        }
        window.location.href = '/dashboard';
      } catch (e) {
        this.verifyError = 'Error de red — inténtalo de nuevo';
      } finally {
        this.verifyLoading = false;
      }
    },

    async resendCode() {
      if (this.resendCooldown > 0) return;
      try {
        await fetch('/auth/resend-code', { method: 'POST', credentials: 'same-origin' });
        this._startResendCooldown(60);
      } catch {}
    },

    async doMfaChallenge() {
      this.mfaError = '';
      this.mfaLoading = true;
      try {
        const r = await fetch('/auth/mfa/challenge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mfa_token: this.mfaToken, code: this.mfaCode.trim() }),
        });
        if (!r.ok) {
          const d = await r.json().catch(() => ({}));
          this.mfaError = d.detail || `Error ${r.status}`;
          return;
        }
        window.location.href = '/dashboard';
      } catch (e) {
        this.mfaError = 'Error de red — inténtalo de nuevo';
      } finally {
        this.mfaLoading = false;
      }
    },

    _startResendCooldown(seconds) {
      this.resendCooldown = seconds;
      const t = setInterval(() => {
        this.resendCooldown--;
        if (this.resendCooldown <= 0) clearInterval(t);
      }, 1000);
    },
  };
}
</script>
</body>
</html>
