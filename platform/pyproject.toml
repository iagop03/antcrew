[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antcrew-platform"
version = "0.6.19"
description = "Production backend for antcrew multi-agent pipelines: REST API, HITL review queue, evaluations, model diff, and dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Elastic-2.0" }
authors = [{ name = "Iago Pueyo", email = "iago.pueyo99@gmail.com" }]
keywords = ["ai", "agents", "llm", "multi-agent", "antcrew", "fastapi", "hitl", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.21",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "python-multipart>=0.0.9",
    "alembic>=1.13",
    "bcrypt>=4.0",
    "pyotp>=2.9",
    "qrcode>=7.4",
    "croniter>=2.0",
    "antcrew>=0.35.0,<0.36.0",
    "PyJWT[cryptography]>=2.8",
    "redis[asyncio]>=5.0",
    "boto3>=1.28",
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
billing = [
    "stripe>=7.0",
]
otel = [
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "cryptography>=41.0",
    "python-dotenv>=1.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    "E402",  # module-level import not at top — conditional/late imports are intentional
    "F401",  # unused import — some are SQLModel schema cross-references or re-exports
    "F841",  # unused variable — review individually; not blocking CI
    "E702",  # multiple statements on one line — rare, review individually
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # SQLModel warns on session.execute(); we use it intentionally for raw SQL aggregate queries
    "ignore:.*session.execute.*:DeprecationWarning",
]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=0"
